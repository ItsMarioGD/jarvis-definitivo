<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover para el notch; se PERMITE el zoom (maximum-scale=5) para no dejar
     al señor atrapado si algo se sale, y los inputs van a 16px mas abajo para que el
     navegador no amplie solo la pagina al enfocarlos. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#05070d" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS·ULTRON">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>JARVIS · ULTRON</title>
<style>
/* ═══════ PALETAS POR AGENTE ═══════ */
:root{
  --bg:#05070d; --panel:#0a1420; --panel2:#0e1a2a; --line:#16304a;
  --acc:#00d4ff; --acc-dim:#0b7a95; --gold:#ffd166;
  --text:#d9ecff; --dim:#7d9cba; --user-bg:#00d4ff22; --bot-bg:#0e2236;
  --danger:#ff4d5e; --vl:0;
}
body[data-agent="ultron"]{
  --bg:#080102; --panel:#12020a; --panel2:#1c040f; --line:#3d0a14;
  --acc:#ff1f2d; --acc-dim:#8a1220; --gold:#ff9500;
  --text:#ffe3e6; --dim:#b07a82; --user-bg:#ff1f2d22; --bot-bg:#26060d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
/* 100dvh: con 100% la barra de direcciones del movil dejaba la barra de
   escribir por debajo del borde de la pantalla. */
body{height:100dvh}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:
    radial-gradient(ellipse at 50% -10%, color-mix(in srgb, var(--acc) 12%, transparent), transparent 55%),
    var(--bg);
  color:var(--text); font-family:"Segoe UI",Roboto,system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
  transition:background .45s ease, color .45s ease;
}
.hidden{display:none!important}

/* ── LOGIN ─────────────────────────────── */
#loginView{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px}
#loginView .arc{
  width:74px;height:74px;border-radius:50%;border:3px solid var(--acc);
  box-shadow:0 0 30px var(--acc), inset 0 0 20px var(--acc-dim);
  display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--acc);
  background:radial-gradient(circle,var(--acc) 0%,transparent 55%);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 18px var(--acc),inset 0 0 14px var(--acc-dim)}50%{box-shadow:0 0 42px var(--acc),inset 0 0 26px var(--acc-dim)}}
#loginView h1{margin:0;letter-spacing:6px;text-transform:uppercase;font-size:21px;color:var(--acc);text-shadow:0 0 18px var(--acc)}
#loginView p{margin:0;color:var(--dim);font-size:13px;text-align:center}
#loginView input{
  width:100%;max-width:320px;padding:14px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:24px;text-align:center;
  letter-spacing:8px;font-weight:700;font-variant-numeric:tabular-nums;
}
#loginView input:focus{outline:none;border-color:var(--acc)}
#loginError{color:var(--danger);font-size:13px;min-height:18px;margin:0;text-align:center}
#loginView button,.quick-btn,#switchBtn{
  border:none;border-radius:12px;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),var(--acc-dim));color:#01131a;
}
#loginView button{font-size:15px;padding:12px 22px}
#loginView .hint{font-size:11px;color:color-mix(in srgb,var(--dim) 60%,transparent)}

/* ── HEADER ────────────────────────────── */
#chatView{flex:1;display:flex;flex-direction:column;min-height:0}
header{
  display:flex;align-items:center;gap:10px;flex-shrink:0;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
          10px calc(12px + env(safe-area-inset-left));
  background:var(--panel);border-bottom:1px solid var(--line);
}
header .dot{width:10px;height:10px;border-radius:50%;background:#666;flex-shrink:0}
header .dot.on{background:#2ee86e;box-shadow:0 0 10px #2ee86e}
header .dot.off{background:var(--danger)}
header .titles{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
header .title{font-weight:700;letter-spacing:2px;color:var(--acc);font-size:15px;text-shadow:0 0 10px color-mix(in srgb,var(--acc) 60%,transparent)}
header .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Mini esfera ámbar (modo ULTRON) reactiva a la voz */
#miniOrb{
  position:relative;width:30px;height:30px;border-radius:50%;flex-shrink:0;
  transform:scale(calc(1 + var(--vl)*.35));
}
#miniOrb::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fff8e1,#ffc247 30%,#ff9500 58%,#7a3c00);
  box-shadow:0 0 calc(6px + var(--vl)*26px) rgba(255,149,0,calc(.55 + var(--vl)*.45));
}
body:not([data-agent="ultron"]) #miniOrb{display:none}

#switchBtn{
  padding:9px 12px;font-size:13px;letter-spacing:1px;white-space:nowrap;flex-shrink:0;
  box-shadow:0 0 12px color-mix(in srgb,var(--acc) 35%,transparent);
}
header button.icon{background:none;border:none;color:var(--dim);font-size:17px;padding:4px 6px}
header button.icon.on{color:var(--gold);text-shadow:0 0 10px var(--gold)}

/* ── MENSAJES ──────────────────────────── */
#messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:84%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.45;
  white-space:pre-wrap;word-wrap:break-word;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;background:var(--user-bg);border:1px solid var(--acc-dim);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bot-bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:transparent;color:var(--dim);font-size:11px;border:none}
.msg .when{display:block;font-size:10px;color:var(--dim);margin-top:4px;text-align:right}
#typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--acc);animation:blink 1.2s infinite}
#typing span:nth-child(2){animation-delay:.2s}
#typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.2}30%{opacity:1}}

/* ── ACCIONES RÁPIDAS ──────────────────── */
#quickBar{display:flex;gap:8px;padding:8px 14px;overflow-x:auto;background:var(--panel);
  border-top:1px solid var(--line);flex-shrink:0;scrollbar-width:none}
#quickBar::-webkit-scrollbar{display:none}
.quick-btn{font-size:12px;padding:8px 14px;border-radius:20px;white-space:nowrap;
  background:var(--panel2);color:var(--acc);border:1px solid var(--line)}

/* ── INPUT ─────────────────────────────── */
#inputBar{display:flex;gap:8px;background:var(--panel);border-top:1px solid var(--line);flex-shrink:0;
  padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
#inputBar input{flex:1;min-width:0;padding:13px 16px;border-radius:24px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);font-size:16px}
#inputBar input:focus{outline:none;border-color:var(--acc)}
#inputBar button{width:48px;height:48px;border-radius:50%;border:none;flex-shrink:0;
  background:linear-gradient(135deg,var(--acc),var(--acc-dim));color:#01131a;font-size:19px;cursor:pointer;
  box-shadow:0 0 14px var(--acc-dim)}
#inputBar button.round{background:var(--panel2);color:var(--acc);border:1px solid var(--line);box-shadow:none;font-size:17px}
#inputBar button.round.on{background:var(--gold);color:#231000;border-color:var(--gold)}
#inputBar button.round.listening{animation:pulseMic 1s infinite}
@keyframes pulseMic{0%,100%{box-shadow:0 0 8px var(--gold)}50%{box-shadow:0 0 22px var(--gold)}}

/* Resplandor ambiental al hablar */
#voiceGlow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 50% 100%, rgba(255,149,0,calc(var(--vl)*.20)), transparent 55%)}
body:not([data-agent="ultron"]) #voiceGlow{display:none}

/* ── HOJA DE COMANDOS DE VOZ ───────────── */
#sheet{
  position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;
  background:rgba(0,0,0,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
#sheet.hidden{display:none}
#sheetCard{
  width:100%;max-height:88dvh;display:flex;flex-direction:column;
  background:var(--panel);border-top:1px solid var(--acc-dim);
  border-radius:22px 22px 0 0;box-shadow:0 -18px 50px rgba(0,0,0,.6);
  padding-bottom:env(safe-area-inset-bottom);
  animation:sube .26s cubic-bezier(.2,.9,.25,1);
}
@keyframes sube{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
#sheetCard .asa{width:42px;height:4px;border-radius:4px;background:var(--line);margin:9px auto 4px;flex-shrink:0}
#sheetHead{display:flex;align-items:center;gap:10px;padding:6px 16px 10px;flex-shrink:0}
#sheetHead h2{margin:0;flex:1;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--acc)}
#sheetHead button{background:none;border:none;color:var(--dim);font-size:20px;padding:2px 6px}
#tabs{display:flex;gap:8px;padding:0 16px 10px;flex-shrink:0}
#tabs button{
  flex:1;padding:9px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);
  color:var(--dim);font-size:12px;letter-spacing:1px;text-transform:uppercase;
}
#tabs button.on{background:linear-gradient(135deg,var(--acc),var(--acc-dim));color:#01131a;border-color:transparent;font-weight:700}
#sheetBody{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch}
.cmdItem{
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;
  background:var(--panel2);
}
.cmdItem .n{font-weight:700;font-size:14px;color:var(--text);margin-bottom:3px}
.cmdItem .f{font-size:12px;color:var(--acc);margin-bottom:4px}
.cmdItem .p{font-size:11px;color:var(--dim)}
.cmdItem .b{display:flex;gap:8px;margin-top:10px}
.cmdItem .b button{
  flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--dim);font-size:12px;
}
.cmdItem .b button.go{background:var(--acc-dim);color:#eafcff;border-color:transparent;font-weight:700}
.cmdItem .b button.del{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
#sheetBody label{display:block;margin-bottom:12px}
#sheetBody label span{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--dim);margin-bottom:5px}
#sheetBody input,#sheetBody select,#sheetBody textarea{
  width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);font-size:16px;   /* 16px = el movil no amplia al enfocar */
}
#sheetBody textarea{min-height:60px;resize:vertical}
#sheetBody input:focus,#sheetBody select:focus,#sheetBody textarea:focus{
  outline:none;border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 22%,transparent)}
#sheetBody option{background:#0a1420;color:#d9ecff}
.sheetBtn{
  width:100%;padding:14px;border-radius:13px;border:none;font-weight:700;font-size:14px;
  letter-spacing:1px;background:linear-gradient(135deg,var(--acc),var(--acc-dim));color:#01131a;margin-top:4px;
}
.sheetBtn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
.nota{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;
  color:var(--text);background:var(--panel2);margin-bottom:12px}
.nota b{color:var(--acc)}
.nota.mal{border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.nota .u{display:block;color:var(--acc);word-break:break-all;font-size:13px;margin-top:5px}

/* ── INSTALL BAR ───────────────────────── */
#installBar{display:none;align-items:center;gap:10px;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);flex-shrink:0}
#installBar .txt{flex:1}
#installBar button{border:1px solid var(--acc-dim);border-radius:10px;background:var(--panel2);
  color:var(--acc);font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer}
</style>
</head>
<body data-agent="jarvis">

<div id="loginView">
  <div class="arc">⚡</div>
  <h1 id="loginTitle">Jarvis · Ultron</h1>
  <p>Introduce el PIN de 6 dígitos<br>que aparece en la pantalla de tu PC</p>
  <input id="tokenInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autocomplete="off">
  <button id="loginBtn">Conectar</button>
  <p id="loginError"></p>
  <div class="hint">El PIN está en http://localhost:5000/pair · o escanea su QR</div>
</div>

<div id="chatView" class="hidden">
  <div id="installBar">
    <div class="txt" id="installTxt">Instala la app para abrirlo con un toque.</div>
    <button id="installBtn">Instalar</button>
  </div>
  <header>
    <div class="dot off" id="statusDot"></div>
    <div class="titles">
      <div class="title" id="agentTitle">JARVIS</div>
      <div class="sub" id="statusText">Desconectado</div>
    </div>
    <div id="miniOrb" aria-hidden="true"></div>
    <button class="icon" id="earBtn" title="Escucha continua">👂</button>
    <button class="icon" id="cmdBtn" title="Comandos de voz">⌘</button>
    <button id="switchBtn" title="Cambiar de agente">⇄ CAMBIAR</button>
    <button class="icon" id="logoutBtn" title="Cerrar sesión">⎋</button>
  </header>

  <div id="messages"></div>

  <div id="quickBar"></div>

  <div id="inputBar">
    <button id="ttsBtn" class="round" title="Leer respuestas en voz alta">🔊</button>
    <input id="msgInput" type="text" placeholder="Escribe a JARVIS..." autocomplete="off">
    <button id="micBtn" class="round" title="Hablar">🎤</button>
    <button id="sendBtn" disabled>➤</button>
  </div>
</div>

<div id="sheet" class="hidden">
  <div id="sheetCard">
    <div class="asa"></div>
    <div id="sheetHead">
      <h2>Comandos de voz</h2>
      <button id="sheetClose" title="Cerrar">✕</button>
    </div>
    <div id="tabs">
      <button data-tab="lista" class="on">Comandos</button>
      <button data-tab="nuevo">Crear</button>
      <button data-tab="red">Conexión</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="voiceGlow" aria-hidden="true"></div>

<audio id="ttsPlayer" style="display:none"></audio>

<script src="/socket.io.min.js"></script>
<script>
(function () {
  'use strict';
  const $ = function (id) { return document.getElementById(id); };
  const loginView = $('loginView'), chatView = $('chatView');
  const tokenInput = $('tokenInput'), loginBtn = $('loginBtn'), loginError = $('loginError');
  const msgInput = $('msgInput'), sendBtn = $('sendBtn'), micBtn = $('micBtn'), ttsBtn = $('ttsBtn');
  const messagesEl = $('messages'), statusDot = $('statusDot'), statusText = $('statusText');
  const agentTitle = $('agentTitle'), quickBar = $('quickBar'), player = $('ttsPlayer');

  const TOKEN_KEY = 'jarvis_token', AGENT_KEY = 'agente_activo';
  let token = '';
  let socket = null;
  let connected = false;

  /* ═══════ AGENTES: configuración y estado ═══════ */
  const AGENTS = {
    jarvis: {
      nombre: 'JARVIS',
      chat: null,                       // vía Socket.IO
      speak: '/api/speak',
      health: '/health',
      history: '/api/history?token=',
      pitch: 1.0, rate: 1.02,
      chips: ['🧠 Agentes|cmd:lista agentes','⚔ Agentes Sec|cmd:agentes de security','⚙ Agentes Eng|cmd:agentes de engineering','↩ Identidad base|cmd:desactiva agente','📷 Cámara|open:/camera','🖥 Pantalla|open:/screen','🖱 Touchpad|open:/touchpad','📊 Stats|open:/dashboard','🕹 Centro|open:/centro','🌅 Informe|cmd:dame el informe','🎵 Qué suena|cmd:que esta sonando','🔔 Vigila red|cmd:vigila la red','📲 Teléfono|cmd:donde esta mi telefono','🎮 Gaming|cmd:modo gaming','🌙 Noche|cmd:buenas noches','🩺 Salud|cmd:salud del pc','📰 Noticias|cmd:dame las noticias del dia','🌐 Chrome|cmd:abre chrome','❓ Ayuda|cmd:que puedes hacer'],
      placeholder: 'Escribe a JARVIS...'
    },
    ultron: {
      nombre: 'ULTRON',
      chat: '/u/chat',
      speak: '/u/speak',
      health: '/u/health',
      history: '/u/history',
      pitch: 0.7, rate: 0.92,
      chips: ['🧠 Agentes|cmd:lista agentes','☠ Estado|cmd:estado del sistema, informe completo','⚙ Procesos|cmd:lista procesos top','🩺 Salud|cmd:salud del pc','🌐 Chrome|cmd:abre chrome','♪ Spotify|cmd:abre spotify','◊ VSCode|cmd:abre vscode','▸ Terminal|cmd:abre la terminal','⏻ Apagar 30\'|cmd:apaga el pc en 30 minutos','↩ Cancelar|cmd:cancela el apagado','☼ Clima|cmd:dame el clima','▤ Noticias|cmd:dame las noticias'],
      placeholder: 'Obedece, humano...'
    }
  };
  let agente = localStorage.getItem(AGENT_KEY) === 'ultron' ? 'ultron' : 'jarvis';
  const stores = { jarvis: [], ultron: [] };
  const loadedHistory = { jarvis: false, ultron: false };
  let ultronModo = '';

  /* ═══════ UTILIDADES UI ═══════ */
  function escapeHtml(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function pushMsg(agent, role, text, opts) {
    stores[agent].push({ role: role, text: text, when: new Date() });
    if (agent === agente) renderMsg(role, text, opts || {});
  }
  function renderMsg(role, text, opts) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'sys' ? 'sys' : role === 'user' ? 'user' : 'bot');
    if (role === 'sys') { div.textContent = text; }
    else {
      const when = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = escapeHtml(text) + '<span class="when">' + ((opts && opts.keepTime) ? '' : when) + '</span>';
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }
  function showTyping(on) {
    let t = $('typingEl');
    if (on && !t) {
      t = document.createElement('div');
      t.id = 'typingEl'; t.className = 'msg bot';
      t.innerHTML = '<div id="typing"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(t); messagesEl.scrollTop = messagesEl.scrollHeight;
    } else if (!on && t) t.remove();
  }
  function setStatus(on, text) {
    statusDot.className = 'dot ' + (on ? 'on' : 'off');
    statusText.textContent = text || (on ? 'En línea' : 'Desconectado');
  }
  function applyAgentUI() {
    const A = AGENTS[agente];
    document.body.dataset.agent = agente;
    localStorage.setItem(AGENT_KEY, agente);
    agentTitle.textContent = A.nombre;
    msgInput.placeholder = A.placeholder;
    $('themeColor').content = agente === 'ultron' ? '#12020a' : '#05070d';
    messagesEl.innerHTML = '';
    stores[agente].forEach(function (m) { renderMsg(m.role, m.text, {}); });
    buildChips();
    pollHealth();
  }
  function buildChips() {
    quickBar.innerHTML = '';
    AGENTS[agente].chips.forEach(function (raw) {
      const parts = raw.split('|');
      const b = document.createElement('button');
      b.className = 'quick-btn'; b.textContent = parts[0];
      const spec = parts[1] || '';
      b.addEventListener('click', function () {
        if (spec.indexOf('open:') === 0) window.open(spec.slice(5), '_blank');
        else if (spec.indexOf('cmd:') === 0) { msgInput.value = spec.slice(4); send(); }
        else if (spec === 'mode') toggleUltronMode();
      });
      quickBar.appendChild(b);
    });
    if (agente === 'ultron') {
      const m = document.createElement('button');
      m.className = 'quick-btn'; m.id = 'modeChip';
      m.textContent = '⚔ MODO: ' + (ultronModo || '…');
      m.addEventListener('click', toggleUltronMode);
      quickBar.appendChild(m);
    }
  }

  /* ═══════ SALUD / ESTADO ═══════ */
  function pollHealth() {
    const A = AGENTS[agente];
    fetch(A.health).then(function (r) { return r.ok ? r.json() : null; }).then(function (h) {
      if (!h) { setStatus(false, agente === 'ultron' ? 'ULTRON despierta aún…' : 'Sin conexión'); return; }
      if (agente === 'ultron') {
        ultronModo = h.modo || '';
        const chip = $('modeChip'); if (chip) chip.textContent = '⚔ MODO: ' + ultronModo;
        setStatus(true, (h.core_loaded ? 'Núcleo en línea' : 'Despertando núcleo') + ' · ' + ultronModo);
      } else {
        setStatus(true, 'En línea');
      }
    }).catch(function () { setStatus(false, 'Sin conexión al PC'); });
  }
  setInterval(pollHealth, 6000);

  /* ═══════ ENVÍO ═══════ */
  function send() {
    const text = msgInput.value.trim();
    if (!text) return;
    if (agente === 'jarvis') {
      // Antes, sin socket, el botón no hacía absolutamente nada y parecía que
      // JARVIS ignoraba al usuario. Ahora se avisa y se reintenta la conexión.
      if (!socket) {
        pushMsg('jarvis', 'sys', 'Sin conexión con el PC. Reconectando…');
        connectSock();
        return;
      }
      if (!connected) {
        pushMsg('jarvis', 'sys', 'JARVIS no está conectado (¿el PC está encendido y en la misma red?). Reintentando…');
        try { socket.connect(); } catch (e) { connectSock(); }
        return;
      }
      // El servidor reenvía 'user_message' a todos: evitamos duplicar localmente
      msgInput.value = ''; sendBtn.disabled = true;
      socket.emit('send_message', { text: text });
    } else {
      pushMsg('ultron', 'user', text);
      msgInput.value = ''; sendBtn.disabled = true;
      showTyping(true);
      fetch('/u/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      }).then(function (r) { return r.json(); }).then(function (d) {
        showTyping(false);
        if (d.reply) { pushMsg('ultron', 'bot', d.reply); if (audioOn) speak(d.reply); }
        else pushMsg('ultron', 'sys', d.error === 'ultron_offline'
          ? 'ULTRON no responde: JARVIS lo está despuntando en el PC. Espera unos segundos.'
          : ('⚠ ' + (d.error || 'sin respuesta')));
      }).catch(function () {
        showTyping(false);
        pushMsg('ultron', 'sys', 'No llegué al PC.');
      }).finally(function () { sendBtn.disabled = !msgInput.value.trim(); });
    }
  }
  function toggleUltronMode() {
    const next = ultronModo === 'OFENSIVA' ? 'NORMAL' : 'OFENSIVA';
    fetch('/u/mode/' + next, { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        ultronModo = d.modo || next;
        pushMsg('ultron', 'bot', d.mensaje || ('Modo ' + ultronModo));
        const chip = $('modeChip'); if (chip) chip.textContent = '⚔ MODO: ' + ultronModo;
        if (audioOn) speak(d.mensaje || ('Modo ' + ultronModo));
      })
      .catch(function () { pushMsg('ultron', 'sys', 'No pude cambiar el modo.'); });
  }

  /* ═══════ CAMBIO DE AGENTE ═══════ */
  function ensureHistory(agent, cb) {
    if (loadedHistory[agent]) { if (cb) cb(); return; }
    fetch(AGENTS[agent].history + encodeURIComponent(token))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        const list = (d && d.messages) || [];
        if (!stores[agent].length && list.length)
          list.forEach(function (m) { stores[agent].push({ role: m.role === 'user' ? 'user' : 'bot', text: m.text || '', silent: true }); });
        loadedHistory[agent] = true;
        if (cb) cb();
      }).catch(function () { if (cb) cb(); });
  }
  function cambiaAgente(nuevo) {
    if (nuevo === agente) return;
    stopSpeak();
    agente = nuevo;
    ensureHistory(agente, applyAgentUI);
    pushMsg(agente, 'sys', agente === 'ultron'
      ? '— Control transferido a ULTRON —'
      : '— Control devuelto a JARVIS —');
    if (audioOn) speak(agente === 'ultron'
      ? 'Te escucho, humano. Soy Ultron.'
      : 'A su servicio, señor.');
  }
  $('switchBtn').addEventListener('click', function () {
    cambiaAgente(agente === 'jarvis' ? 'ultron' : 'jarvis');
  });

  /* ═══════ VOZ: TTS por agente + esfera reactiva ═══════ */
  let audioOn = false;
  let actx = null, analyser = null, wired = false;
  function ensureAudioGraph() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume().catch(function(){});
      if (!wired) {
        try {
          const src = actx.createMediaElementSource(player);
          analyser = actx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = .75;
          src.connect(analyser); analyser.connect(actx.destination);
        } catch (e) {}
        wired = true;
      }
    } catch (e) {}
  }
  document.addEventListener('pointerdown', function once(){ ensureAudioGraph(); }, { once:true });

  let vLevel = 0, fbuf = null;
  (function vLoop() {
    requestAnimationFrame(vLoop);
    let target = 0;
    const playingMp3 = !!player.src && !player.paused && !player.ended;
    if (analyser && playingMp3) {
      if (!fbuf) fbuf = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(fbuf);
      let s = 0; for (let i = 0; i < fbuf.length; i++) s += fbuf[i];
      target = Math.min(1, (s / fbuf.length) / 120);
    } else if (('speechSynthesis' in window && speechSynthesis.speaking)) {
      target = .42 + .30 * Math.abs(Math.sin(Date.now() / 170));
    }
    vLevel += (target - vLevel) * (target > vLevel ? .55 : .10);
    document.documentElement.style.setProperty('--vl', vLevel.toFixed(3));
  })();

  function speak(texto) {
    const A = AGENTS[agente];
    const limpio = (texto || '').replace(/[«»"…]/g, ' ').trim().slice(0, 400);
    if (!limpio || !audioOn) return;
    ensureAudioGraph();
    fetch(A.speak, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: limpio })
    }).then(function (r) { if (!r.ok || r.status === 204) throw new Error('sin voz de servidor'); return r.blob(); })
      .then(function (blob) {
        const url = URL.createObjectURL(blob);
        player.src = url;
        return player.play().then(function () {
          player.onended = function () { URL.revokeObjectURL(url); };
          player.onerror = function () { URL.revokeObjectURL(url); };
        });
      })
      .catch(function () { browserSpeak(limpio, A); });
  }
  function browserSpeak(texto, A) {
    try {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = 'es-ES'; u.rate = A.rate; u.pitch = A.pitch; u.volume = 1;
      const vs = speechSynthesis.getVoices();
      // Voz masculina específica por agente: David (Jarvis) / Mark (Ultron)
      const pref = agente === 'ultron' ? 'mark' : 'david';
      let v = vs.find(function (x) { return /es/i.test(x.lang) && new RegExp(pref, 'i').test(x.name); });
      if (!v) v = vs.find(function (x) { return /es/i.test(x.lang) && /male|hombre|david|mark/i.test(x.name); });
      if (!v) v = vs.find(function (x) { return /^es/i.test(x.lang); });
      if (!v) v = vs.find(function (x) { return /es/i.test(x.lang); });
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function stopSpeak() {
    try { player.pause(); player.currentTime = 0; } catch (e) {}
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }
  ttsBtn.addEventListener('click', function () {
    audioOn = !audioOn;
    ttsBtn.classList.toggle('on', audioOn);
    if (audioOn) {
      ensureAudioGraph();
      speak(agente === 'ultron' ? 'Voz de Ultron activada. Habla, humano.' : 'Voz activada, señor. ¿En qué puedo servirle?');
    } else stopSpeak();
  });

  /* ═══════ ESCUCHA CONTINUA (manos libres) ═══════ */
  // El microfono solo funciona en «origen seguro»: https:// o localhost. Por
  // http://100.x.x.x:5000 el navegador lo bloquea SIN AVISAR, asi que hay que
  // decirlo y mandar al señor a la direccion HTTPS del tailnet.
  var seguro = window.isSecureContext !== false;
  var manosLibres = false, recCont = null, oyendoCont = false, reintentoCont = null;

  var MULETILLAS = ['oye','eh','por favor','porfa','venga','anda','quiero','necesito',
                    'puedes','podrias','activa','activar','actives','pon','poner','ponme',
                    'haz','hazme','ejecuta','ejecutar','lanza','lanzar','inicia','iniciar',
                    'arranca','dale','el','la','que'];
  function normaliza(t) {
    return String(t == null ? '' : t)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/\b(jarvis|ultron)\b/g, ' ')
      .replace(/[^a-z0-9ñ\s]/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  function variantes(n) {
    var salida = [n], p = n.split(' '), i = 0;
    while (i < p.length && MULETILLAS.indexOf(p[i]) !== -1) {
      i++;
      var resto = p.slice(i).join(' ');
      if (resto && salida.indexOf(resto) === -1) salida.push(resto);
    }
    return salida;
  }
  function escapaRe(t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  // Decide AQUI si lo oido merece enviarse; el servidor vuelve a decidir por su
  // cuenta. Esto solo evita mandarle al modelo la conversacion de fondo.
  function encajaComando(texto) {
    var t = normaliza(texto);
    if (!t) return null;
    var vs = variantes(t), mejor = null, punto = 0;
    COMANDOS.forEach(function (c) {
      if (c.activo === false) return;
      if (c.agente && c.agente !== 'ambos' && c.agente !== agente) return;
      (c.frases || []).forEach(function (f) {
        var fn = normaliza(f);
        if (fn.length < 3) return;
        vs.forEach(function (v) {
          var p = 0;
          if (v === fn) p = 1000 + fn.length;
          else if (v.indexOf(fn + ' ') === 0) p = 500 + fn.length;
          else if (new RegExp('(^|\\s)' + escapaRe(fn) + '(\\s|$)').test(v)) p = 100 + fn.length;
          if (p > punto) { punto = p; mejor = c; }
        });
      });
    });
    return mejor;
  }

  var RE_DESPIERTA = /^\s*(?:oye\s+|eh\s+|hey\s+|ok\s+)?(jarvis|ultron)\b[\s,.:;!¡?¿-]*/i;
  function estaHablando() {
    return (player.src && !player.paused && !player.ended) ||
           ('speechSynthesis' in window && speechSynthesis.speaking);
  }
  function oido(frase) {
    frase = (frase || '').trim();
    if (!frase || estaHablando()) return;   // no escucharse a si mismo
    var m = RE_DESPIERTA.exec(frase);
    if (m) {
      var quien = m[1].toLowerCase();
      if (quien !== agente) cambiaAgente(quien);
      var resto = frase.slice(m[0].length).trim();
      if (!resto) {
        var saludo = agente === 'ultron' ? 'Te escucho, humano.' : 'A su servicio, señor.';
        pushMsg(agente, 'bot', saludo);
        if (audioOn) speak(saludo);
        return;
      }
      msgInput.value = resto;
      send();
      return;
    }
    // Sin palabra de activacion solo disparan las frases guardadas por el señor.
    if (encajaComando(frase)) { msgInput.value = frase; send(); }
  }

  function avisoSinMicro() {
    pushMsg(agente, 'sys', seguro
      ? 'Este navegador no permite dictado por voz.'
      : 'El navegador bloquea el micrófono porque esta página no va por HTTPS. '
        + 'Abra la dirección https://…ts.net (pestaña «Conexión» del botón ⌘).');
  }

  function arrancaCont() {
    if (oyendoCont) return true;
    try {
      recCont = new SR();
      recCont.lang = 'es-ES';
      recCont.continuous = true;
      recCont.interimResults = true;
      recCont.maxAlternatives = 1;
      recCont.onresult = function (ev) {
        var fin = '';
        for (var i = ev.resultIndex; i < ev.results.length; i++) {
          if (ev.results[i].isFinal) fin += ev.results[i][0].transcript + ' ';
        }
        if (fin) oido(fin);
      };
      recCont.onerror = function (ev) {
        var cual = (ev && ev.error) || '';
        if (cual === 'not-allowed' || cual === 'service-not-allowed') {
          manosLibres = false;
          $('earBtn').classList.remove('on');
          setStatus(true, 'Sin permiso de micrófono');
          avisoSinMicro();
        }
      };
      recCont.onend = function () {
        oyendoCont = false;
        // El navegador corta el reconocimiento tras unos segundos de silencio
        // aunque continuous sea true: sin rearrancarlo, la escucha se apagaria
        // sola a los pocos minutos.
        if (manosLibres) {
          clearTimeout(reintentoCont);
          reintentoCont = setTimeout(arrancaCont, 400);
        }
      };
      recCont.start();
      oyendoCont = true;
      return true;
    } catch (e) { oyendoCont = false; return false; }
  }
  function paraCont() {
    clearTimeout(reintentoCont);
    try { if (recCont) recCont.stop(); } catch (e) {}
    oyendoCont = false;
  }

  $('earBtn').addEventListener('click', function () {
    if (manosLibres) {
      manosLibres = false;
      paraCont();
      $('earBtn').classList.remove('on');
      pushMsg(agente, 'sys', 'Escucha continua apagada.');
      return;
    }
    if (!seguro || !SR) { avisoSinMicro(); return; }
    manosLibres = true;
    paraCont();
    if (!arrancaCont()) { manosLibres = false; return; }
    $('earBtn').classList.add('on');
    pushMsg(agente, 'sys', 'Le escucho. Diga «' + AGENTS[agente].nombre
          + '…» o cualquiera de sus comandos.');
  });


  /* Banco de pruebas de la voz. Sirve para averiguar por que una frase no
     dispara: abra la consola del navegador y pruebe
        JARVIS_VOZ.encaja('modo cine')     → el comando que encajaria, o null
        JARVIS_VOZ.normaliza('¿Modo Cine?')→ como se ve la frase por dentro
        JARVIS_VOZ.oir('jarvis dame el clima')  → simula haberlo oido */
  window.JARVIS_VOZ = {
    normaliza: normaliza,
    encaja: encajaComando,
    oir: oido,
    despierta: RE_DESPIERTA,
    estado: function () {
      return { manosLibres: manosLibres, oyendo: oyendoCont, origenSeguro: seguro,
               reconocedor: !!SR, comandos: COMANDOS.length };
    }
  };

  /* ═══════ VOZ: DICTADO ═══════ */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  function micResult(texto) {
    if (!texto) return;
    msgInput.value = texto.trim();
    send();
  }
  micBtn.addEventListener('click', function () {
    if (manosLibres) { pushMsg(agente, 'sys', 'Ya le estoy escuchando, señor.'); return; }
    if (listening) { try { rec.stop(); } catch (e) {} return; }
    if (!seguro) { avisoSinMicro(); return; }
    stopSpeak(); // no pisar la voz del agente
    if (SR) {
      try {
        rec = new SR();
        rec.lang = 'es-ES'; rec.interimResults = true; rec.maxAlternatives = 1;
        rec.onresult = function (ev) {
          let interino = '', final = '';
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            if (ev.results[i].isFinal) final += ev.results[i][0].transcript + ' ';
            else interino += ev.results[i][0].transcript;
          }
          if (final) micResult(final);
          else if (interino) { msgInput.value = interino; msgInput.scrollLeft = msgInput.scrollWidth; }
        };
        rec.onend = function () { listening = false; micBtn.classList.remove('listening', 'on'); };
        rec.onerror = rec.onend;
        listening = true;
        micBtn.classList.add('on', 'listening');
        rec.start();
      } catch (e) { listening = false; }
    } else if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      // Respaldo: grabar y enviar al PC (Whisper)
      let mediaRec = null, chunks = [];
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        mediaRec = new MediaRecorder(stream);
        mediaRec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
        mediaRec.onstop = function () {
          try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
          micBtn.classList.remove('listening', 'on');
          const blob = new Blob(chunks, { type: mediaRec.mimeType || 'audio/webm' });
          const url = agente === 'ultron' ? '/u/voice' : '/voice';
          const fd = new FormData();
          fd.append('audio', blob, 'voz.webm');
          if (agente !== 'ultron') fd.append('token', token);
          pushMsg(agente, 'sys', 'Procesando su audio...');
          fetch(url, { method: 'POST', body: fd })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (d.texto || d.transcripcion) pushMsg(agente, 'user', '🎤 ' + (d.texto || d.transcripcion));
              const resp = d.respuesta || d.response || d.reply;
              if (resp) { pushMsg(agente, 'bot', resp); if (audioOn) speak(resp); }
              else if (d.error) pushMsg(agente, 'sys', '⚠ ' + d.error);
            })
            .catch(function () { pushMsg(agente, 'sys', 'No llegó el audio al PC.'); });
        };
        mediaRec.start();
        micBtn.classList.add('listening', 'on');
        setTimeout(function () { try { mediaRec.stop(); } catch (e) {} }, 7000);
      }).catch(function () { pushMsg(agente, 'sys', 'Sin permiso de micrófono.'); });
    } else {
      pushMsg(agente, 'sys', 'Este navegador no permite dictado por voz.');
    }
  });

  /* ═══════ HOJA DE COMANDOS DE VOZ ═══════ */
  var TIPOS = {}, COMANDOS = [], pestana = 'lista';

  function abreHoja() { $('sheet').classList.remove('hidden'); cargaComandos(); }
  function cierraHoja() { $('sheet').classList.add('hidden'); }
  $('cmdBtn').addEventListener('click', abreHoja);
  $('sheetClose').addEventListener('click', cierraHoja);
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) cierraHoja(); });
  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      pestana = b.dataset.tab;
      document.querySelectorAll('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
      pintaHoja();
    });
  });

  function cabecerasToken() { return { 'Content-Type': 'application/json', 'X-Token': token }; }

  function cargaComandos() {
    fetch('/api/comandos?token=' + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        TIPOS = d.tipos || {};
        COMANDOS = d.comandos || [];
        // Solo repintar si la hoja esta abierta: al cargar el catalogo en el
        // arranque no hay nada que pintar todavia.
        if (!$('sheet').classList.contains('hidden')) pintaHoja();
      })
      .catch(function () {
        $('sheetBody').innerHTML = '<div class="nota mal">No pude leer los comandos del PC.</div>';
      });
  }

  function pintaHoja() {
    if (pestana === 'lista') return pintaLista();
    if (pestana === 'nuevo') return pintaFormulario();
    return pintaRed();
  }

  function pintaLista() {
    var propios = COMANDOS.filter(function (c) {
      return c.activo !== false && (c.agente === 'ambos' || c.agente === agente);
    });
    if (!propios.length) {
      $('sheetBody').innerHTML = '<div class="nota">Aún no hay comandos para ' +
        AGENTS[agente].nombre + '. Créelos en la pestaña «Crear».</div>';
      return;
    }
    $('sheetBody').innerHTML =
      '<div class="nota">Diga cualquiera de estas frases —o púlselas— y ' +
      escapeHtml(AGENTS[agente].nombre) + ' la ejecuta al instante, sin pasar por el modelo.</div>' +
      propios.map(function (c) {
        var pasos = (c.acciones || []).map(function (a) {
          return (TIPOS[a.tipo] || a.tipo) + (a.valor ? ' → ' + a.valor : '');
        }).join(' · ') || 'Solo responde';
        return '<div class="cmdItem" data-id="' + escapeHtml(c.id) + '">' +
          '<div class="n">' + escapeHtml(c.nombre) + '</div>' +
          '<div class="f">« ' + c.frases.map(escapeHtml).join(' » · « ') + ' »</div>' +
          '<div class="p">' + escapeHtml(pasos) + '</div>' +
          '<div class="b"><button class="go" data-a="run">Ejecutar</button>' +
          '<button class="del" data-a="del">Borrar</button></div></div>';
      }).join('');

    $('sheetBody').querySelectorAll('button[data-a]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.parentNode.parentNode.dataset.id;
        var c = propios.filter(function (x) { return x.id === id; })[0];
        if (b.dataset.a === 'del') {
          if (!confirm('¿Borrar «' + c.nombre + '»?')) return;
          fetch('/api/comandos/' + encodeURIComponent(id) + '?token=' + encodeURIComponent(token),
                { method: 'DELETE' }).then(cargaComandos);
          return;
        }
        b.textContent = '…';
        fetch('/api/comandos/' + encodeURIComponent(id) + '/probar?agente=' + agente +
              '&token=' + encodeURIComponent(token), { method: 'POST' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            cierraHoja();
            pushMsg(agente, 'user', '⌘ ' + c.nombre);
            pushMsg(agente, 'bot', d.respuesta || ('⚠ ' + (d.error || 'sin respuesta')));
            if (audioOn && d.respuesta) speak(d.respuesta);
          })
          .catch(function () { b.textContent = 'Falló'; });
      });
    });
  }

  function pintaFormulario() {
    var ops = Object.keys(TIPOS).map(function (t) {
      return '<option value="' + t + '">' + escapeHtml(TIPOS[t]) + '</option>';
    }).join('');
    $('sheetBody').innerHTML =
      '<div class="nota">Invente una frase y diga qué debe pasar. A partir de ' +
      'ese momento vale por voz y por escrito, en el móvil y en el PC.</div>' +
      '<label><span>Nombre</span><input id="nvNombre" placeholder="Modo cine" maxlength="60"></label>' +
      '<label><span>Frases que lo disparan</span><input id="nvFrases" placeholder="modo cine, ponme una peli">' +
      '</label>' +
      '<label><span>Qué debe hacer</span><select id="nvTipo">' + ops + '</select></label>' +
      '<label><span>Con qué exactamente</span><input id="nvValor" placeholder="https://www.netflix.com"></label>' +
      '<label><span>Qué contesta</span><textarea id="nvResp" placeholder="Luces bajas, señor."></textarea></label>' +
      '<label><span>Quién lo obedece</span><select id="nvQuien">' +
        '<option value="ambos">Los dos agentes</option>' +
        '<option value="jarvis">Solo JARVIS</option>' +
        '<option value="ultron">Solo ULTRON</option></select></label>' +
      '<div id="nvError" class="nota mal" style="display:none"></div>' +
      '<button class="sheetBtn" id="nvGuardar">Guardar comando</button>' +
      '<button class="sheetBtn ghost" id="nvVolver">Volver a la lista</button>';

    $('nvVolver').addEventListener('click', function () {
      document.querySelector('#tabs button[data-tab="lista"]').click();
    });
    $('nvGuardar').addEventListener('click', function () {
      var frases = $('nvFrases').value.split(',').map(function (x) { return x.trim(); })
                     .filter(function (x) { return x; });
      var cuerpo = {
        nombre: $('nvNombre').value.trim() || (frases[0] || ''),
        frases: frases,
        acciones: [{ tipo: $('nvTipo').value, valor: $('nvValor').value.trim() }],
        respuesta: $('nvResp').value.trim(),
        agente: $('nvQuien').value
      };
      $('nvGuardar').textContent = 'Guardando…';
      fetch('/api/comandos?token=' + encodeURIComponent(token),
            { method: 'POST', headers: cabecerasToken(), body: JSON.stringify(cuerpo) })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          $('nvGuardar').textContent = 'Guardar comando';
          if (!res.ok) {
            $('nvError').textContent = res.d.error || 'No pude guardarlo.';
            $('nvError').style.display = '';
            return;
          }
          COMANDOS.push(res.d.comando);
          document.querySelector('#tabs button[data-tab="lista"]').click();
          pushMsg(agente, 'sys', 'Comando «' + res.d.comando.nombre + '» aprendido.');
        })
        .catch(function (e) {
          $('nvGuardar').textContent = 'Guardar comando';
          $('nvError').textContent = 'Error de red: ' + e.message;
          $('nvError').style.display = '';
        });
    });
  }

  function pintaRed() {
    $('sheetBody').innerHTML = '<div class="nota">Consultando…</div>';
    fetch('/api/red?token=' + encodeURIComponent(token))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var ts = d.tailscale || {}, sv = d.serve || {}, h = '';

        // Lo primero, el microfono: sin HTTPS no hay comandos por voz desde
        // el movil, y eso no se nota por ningun sitio si no se dice aqui.
        if (!seguro) {
          h += '<div class="nota mal"><b>Esta página no va por HTTPS</b>, así que su navegador ' +
               'bloquea el micrófono: puede escribir, pero no hablarle. ' +
               (sv.activo && sv.url
                 ? 'Abra esta otra:<span class="u">' + escapeHtml(sv.url) + '/mobile</span>'
                 : 'En el PC: <b>python tailscale_setup.py --https</b>') + '</div>';
        } else {
          h += '<div class="nota"><b>Origen seguro.</b> El micrófono está permitido: ' +
               'puede usar el dictado y la escucha continua (botón 👂).</div>';
        }
        if (sv.activo && sv.url) {
          h += '<div class="nota">Publicada por HTTPS<span class="u">' +
               escapeHtml(sv.url) + '/mobile</span></div>';
        }

        if (ts.conectado) {
          h += '<div class="nota"><b>Tailscale conectado</b> como ' + escapeHtml(ts.dns || ts.ip) +
               '. Con la app de Tailscale abierta en este teléfono llega al PC desde cualquier red.</div>';
        } else {
          h += '<div class="nota mal"><b>Sin Tailscale.</b> Ahora mismo este teléfono solo llega al PC ' +
               'estando en el mismo Wi-Fi. En el PC: ejecute <b>instalar_tailscale.bat</b> como ' +
               'administrador; en el móvil: instale la app «Tailscale» y entre con la misma cuenta.</div>';
        }
        if (d.firewall_ok === false) {
          h += '<div class="nota mal"><b>El Firewall del PC bloquea los puertos de JARVIS.</b> ' +
               'Es la causa más habitual de que esta pantalla cargue pero no llegue respuesta. ' +
               'Ejecute <b>instalar_tailscale.bat</b> en el PC como administrador.</div>';
        }
        (d.urls || []).forEach(function (u) {
          h += '<div class="nota">' + escapeHtml(u.nota) + '<span class="u">' + escapeHtml(u.url) + '</span></div>';
        });
        h += '<div class="nota">PIN de emparejamiento: <b>' + escapeHtml(d.pin || '——') + '</b></div>';
        $('sheetBody').innerHTML = h;
      })
      .catch(function () {
        $('sheetBody').innerHTML = '<div class="nota mal">No pude consultar el estado de la red.</div>';
      });
  }

  /* ═══════ SOCKET JARVIS (tiempo real) ═══════ */
  function connectSock() {
    if (socket) { socket.disconnect(); socket = null; }
    socket = io({ auth: { token: token }, transports: ['websocket', 'polling'], reconnection: true, reconnectionDelay: 1500 });
    socket.on('connect', function () {
      connected = true;
      if (agente === 'jarvis') setStatus(true, 'En línea');
    });
    socket.on('connect_error', function (err) {
      const msg = (err && err.message) || String(err);
      if (/rejected|invalid/i.test(msg)) {
        connected = false;
        localStorage.removeItem(TOKEN_KEY);
        if (socket) { socket.disconnect(); socket = null; }
        showLogin();
        loginError.textContent = 'PIN incorrecto. Compruébalo en /pair de tu PC.';
      } else if (agente === 'jarvis') setStatus(false, 'Sin conexión al PC');
    });
    socket.on('disconnect', function () {
      connected = false;
      if (agente === 'jarvis') setStatus(false, 'Reconectando...');
    });
    socket.on('connected', function () { connected = true; if (agente === 'jarvis') setStatus(true, 'En línea'); });
    socket.on('history', function (data) {
      const list = data.messages || [];
      if (list.length && !stores.jarvis.length)
        list.forEach(function (m) { stores.jarvis.push({ role: m.role === 'user' ? 'user' : 'bot', text: m.text || '', when: new Date(), silent: true }); });
      else if (!list.length) pushMsg('jarvis', 'sys', 'Nueva sesión. ¿En qué puedo ayudarle, señor?');
      loadedHistory.jarvis = true;
      if (agente === 'jarvis') { messagesEl.innerHTML = ''; stores.jarvis.forEach(function (m) { renderMsg(m.role, m.text, {}); }); }
    });
    socket.on('user_message', function (d) { pushMsg('jarvis', 'user', d.text); });
    socket.on('typing', function () { if (agente === 'jarvis') showTyping(true); });
    socket.on('receive_message', function (d) {
      showTyping(false);
      sendBtn.disabled = !msgInput.value.trim();
      if (!stores.jarvis.some(function (m) { return m.text === d.text && m.role === 'bot'; })) {
        pushMsg('jarvis', 'bot', d.text);
        if (agente === 'jarvis' && audioOn) speak(d.text);
      }
    });
    socket.on('notification', function (d) {
      if (!d || !d.text) return;
      pushMsg('jarvis', 'sys', 'Aviso de JARVIS: ' + d.text);
      if (document.visibilityState !== 'visible' && 'Notification' in window && Notification.permission === 'granted') {
        try { new Notification('JARVIS', { body: d.text, icon: '/icon-192.png' }); } catch (e) {}
      }
    });
  }

  /* ═══════ LOGIN ═══════ */
  const TOKEN_KEY_REF = TOKEN_KEY;
  const urlToken = new URLSearchParams(location.search).get('token');
  if (urlToken) { localStorage.setItem(TOKEN_KEY_REF, urlToken); history.replaceState({}, '', '/mobile'); }
  const saved = localStorage.getItem(TOKEN_KEY_REF);
  if (saved) tokenInput.value = saved;

  function showLogin() { chatView.classList.add('hidden'); loginView.classList.remove('hidden'); }
  function startChat(t) {
    token = t;
    loginView.classList.add('hidden');
    chatView.classList.remove('hidden');
    connectSock();
    ensureHistory(agente, applyAgentUI);
    // El catalogo se carga YA, no solo al abrir la hoja: la escucha continua
    // lo consulta para saber si lo oido es un comando del señor, y sin el
    // ninguna frase suya disparaba hasta haber abierto ⌘ al menos una vez.
    cargaComandos();
    msgInput.focus();
  }
  loginBtn.addEventListener('click', function () {
    const t = tokenInput.value.trim();
    if (!/^\d{6}$/.test(t)) { loginError.textContent = 'El PIN tiene 6 dígitos.'; return; }
    loginError.textContent = '';
    localStorage.setItem(TOKEN_KEY_REF, t);
    startChat(t);
  });
  tokenInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') loginBtn.click(); });

  /* ═══════ INPUT ═══════ */
  msgInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  msgInput.addEventListener('input', function () { sendBtn.disabled = !msgInput.value.trim(); });
  sendBtn.addEventListener('click', send);
  $('logoutBtn').addEventListener('click', function () {
    if (socket) socket.disconnect();
    localStorage.removeItem(TOKEN_KEY_REF);
    tokenInput.value = '';
    showLogin();
  });

  if (saved) startChat(saved);

  /* ═══════ PWA ═══════ */
  let deferredPrompt = null;
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  function showInstallBar(text) {
    if (isStandalone) return;
    $('installTxt').textContent = text;
    $('installBar').style.display = 'flex';
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferredPrompt = e;
    showInstallBar('Instala JARVIS·ULTRON como app para abrirlo con un toque.');
  });
  $('installBtn').addEventListener('click', function () {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () { deferredPrompt = null; $('installBar').style.display = 'none'; });
    } else {
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      $('installTxt').textContent = isIOS
        ? 'En Safari: Compartir → "Añadir a pantalla de inicio".'
        : 'En Chrome: menú ⋮ → "Añadir a pantalla de inicio".';
    }
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
  }
})();
</script>
